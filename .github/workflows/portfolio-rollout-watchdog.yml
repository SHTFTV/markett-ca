name: Independent portfolio coordinator watchdog
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-four-roles-state
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          git config user.name 'markett-rollout-watchdog'
          git config user.email 'markett-rollout-watchdog@users.noreply.github.com'
      - name: Check actual coordinator freshness without invoking coordinator
        env:
          ROLLOUT_COMMIT: 'true'
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/rollout/run.mjs --watchdog
