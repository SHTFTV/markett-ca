name: Public portfolio audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/agents/**'
      - 'scripts/completion/**'
      - 'scripts/monitor/**'
      - 'lib/operations-monitor*'
      - 'lib/site-build-gate.mjs'
      - 'lib/*completion*'
      - 'docs/completion/**'
      - 'api/completion-records.js'
      - '.github/workflows/portfolio-audit.yml'
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: Portfolio batch
        type: choice
        default: all
        options: [all, insulation, mechanical, interiors]
permissions:
  contents: read
concurrency:
  group: portfolio-public-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test runner
        run: node --test scripts/agents/audit.test.mjs scripts/agents/report-audit.test.mjs
      - name: Test operational completion gate
        run: node --test scripts/completion/*.test.mjs scripts/monitor/*.test.mjs
      - name: Emit completion matrix without upgrading partial sites
        run: node scripts/completion/report.mjs docs/completion/current-records.json "$RUNNER_TEMP/portfolio-audit"
      - name: Audit configured domains
        env:
          AUDIT_BATCH: ${{ inputs.batch || 'all' }}
        run: node scripts/agents/audit.mjs "$AUDIT_BATCH" "$RUNNER_TEMP/portfolio-audit"
      - name: Persist actual per-site check receipts in the shared operations database
        env:
          MARKETT_OPERATIONS_EVENT_KEY: ${{ secrets.MARKETT_OPERATIONS_EVENT_KEY }}
        run: node scripts/agents/report-audit.mjs "$RUNNER_TEMP/portfolio-audit/portfolio-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/portfolio-audit/
          retention-days: 14
          if-no-files-found: error

