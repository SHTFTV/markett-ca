name: Independent curator discovery
on:
  push:
    branches: [codex/independent-curator-discovery, main]
    paths: ['scripts/curator-isolation/**', 'docs/curator-isolation/**', '.github/workflows/independent-curator-discovery.yml']
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: curator-discovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test independent failure and restart recovery
        run: python3 -m unittest discover -s scripts/curator-isolation -p 'test_runner.py' -v
      - name: Restore this branch's metadata state
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_PATH: ${{ runner.temp }}/discovery.sqlite
        run: python3 scripts/curator-isolation/restore_state.py
      - name: Collect public metadata independently of all publisher holds
        run: python3 scripts/curator-isolation/runner.py --config docs/curator-isolation/connections.json --db "$RUNNER_TEMP/discovery.sqlite" --output "$RUNNER_TEMP/handoffs"
      - name: Preserve per-site results including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curator-isolation-handoffs
          path: ${{ runner.temp }}/handoffs
          retention-days: 30
      - name: Preserve next-run deduplication state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curator-isolation-state
          path: ${{ runner.temp }}/discovery.sqlite
          retention-days: 30
