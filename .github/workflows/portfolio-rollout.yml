name: Portfolio Four Roles coordinator
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-four-roles-state
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure repository-scoped durable queue writer
        run: |
          git config user.name 'markett-rollout-bot'
          git config user.email 'markett-rollout-bot@users.noreply.github.com'
      - name: Verify queue and stamp invariants
        run: node --test scripts/rollout/*.test.mjs
      - name: Lease, execute bounded adapters, retain blockers and checkpoint
        env:
          ROLLOUT_COMMIT: 'true'
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/rollout/run.mjs
